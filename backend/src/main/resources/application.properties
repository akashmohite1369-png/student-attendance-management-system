spring.application.name=student-attendance-api
server.port=${PORT:8080}

# Local default: H2 file database. On Render Free, local files are ephemeral.
# For a persistent Render deployment, point DB_URL at a directory on a persistent disk.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/attendance_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Keep enabled for local development. Render Blueprint disables it in production.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
